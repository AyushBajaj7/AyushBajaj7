<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Ayush Bajaj — Complex signals. Clear decisions.</title>
  <desc id="desc">Software systems and applied AI. An illuminated dependency graph connects a code change to its downstream impact.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08121F"/>
      <stop offset="0.58" stop-color="#0B1325"/>
      <stop offset="1" stop-color="#171330"/>
    </linearGradient>
    <linearGradient id="accent" x1="54" y1="0" x2="1180" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6DE4D5"/>
      <stop offset="0.55" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#A99AFF"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#6466D5" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#6466D5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#A5B4FC" stroke-opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="388" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="390" fill="url(#background)"/>
    <rect width="1280" height="390" fill="url(#grid)"/>
    <ellipse cx="1030" cy="180" rx="310" ry="290" fill="url(#halo)"/>
    <path d="M54 0H1226" stroke="url(#accent)" stroke-width="3"/>

    <g font-family="Arial, Helvetica, sans-serif">
      <text x="54" y="59" fill="#8D9DB6" font-size="13" font-weight="700" letter-spacing="3">AYUSH BAJAJ / SOFTWARE DEVELOPER</text>
      <text x="50" y="151" fill="#F1F5FB" font-size="70" font-weight="700" letter-spacing="-2.8">Complex signals.</text>
      <text x="50" y="229" fill="url(#accent)" font-size="70" font-weight="700" letter-spacing="-2.8">Clear decisions.</text>
      <text x="54" y="276" fill="#9EAEC6" font-size="20">I build the software that connects them.</text>
    </g>

    <!-- Dependency graph: an input, a service map, then a decision. -->
    <g stroke="#7886B8" stroke-width="1.5" stroke-opacity="0.35">
      <path d="M816 173L904 100L1007 130L1112 92L1195 155"/>
      <path d="M816 173L900 245L1007 216L1112 268L1195 205"/>
      <path d="M904 100L900 245M1007 130V216M1112 92V268"/>
      <path d="M904 100L1007 216L1112 92M900 245L1007 130L1112 268"/>
    </g>
    <path d="M816 173L1007 173L1148 173" stroke="url(#accent)" stroke-width="8" opacity="0.13" filter="url(#glow)"/>
    <path d="M816 173H1148" stroke="url(#accent)" stroke-width="2"/>
    <g fill="#111D32" stroke="#596A93" stroke-width="1.5">
      <circle cx="904" cy="100" r="7"/><circle cx="900" cy="245" r="7"/>
      <circle cx="1007" cy="130" r="7"/><circle cx="1007" cy="216" r="7"/>
      <circle cx="1112" cy="92" r="7"/><circle cx="1112" cy="268" r="7"/>
      <circle cx="1195" cy="155" r="5"/><circle cx="1195" cy="205" r="5"/>
    </g>
    <circle cx="816" cy="173" r="26" fill="#0D232D" stroke="#6DE4D5" stroke-width="1.5"/>
    <path d="M809 165L801 173L809 181M823 165L831 173L823 181M820 162L812 184" stroke="#6DE4D5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1007" cy="173" r="20" fill="#101F36" stroke="#7DD3FC" stroke-width="1.5"/>
    <circle cx="1007" cy="173" r="5" fill="#7DD3FC"/>
    <circle cx="1148" cy="173" r="26" fill="#211D3A" stroke="#A99AFF" stroke-width="1.5"/>
    <path d="M1137 173L1145 181L1160 165" stroke="#BEAEFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.4" text-anchor="middle">
      <text x="816" y="219" fill="#6DE4D5">CHANGE</text>
      <text x="1007" y="74" fill="#7DD3FC">CONTEXT</text>
      <text x="1148" y="219" fill="#BEAEFF">DECISION</text>
    </g>

    <path d="M54 317H1226" stroke="#29334D"/>
    <g font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2.3">
      <text x="54" y="352" fill="#C1CDE0">BACKEND SYSTEMS</text>
      <text x="267" y="352" fill="#55647E">/</text>
      <text x="302" y="352" fill="#C1CDE0">APPLIED AI</text>
      <text x="459" y="352" fill="#55647E">/</text>
      <text x="494" y="352" fill="#C1CDE0">FULL-STACK PRODUCTS</text>
      <text x="1226" y="352" fill="#71839F" text-anchor="end">VIT VELLORE · CSE 2027</text>
    </g>
  </g>
  <rect x="1" y="1" width="1278" height="388" rx="20" stroke="#29334D"/>
</svg>
